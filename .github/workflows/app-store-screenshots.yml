name: App Store screenshots

# Takes the App Store screenshots (iPhone 6.9", 1320 x 2868) on a GitHub Mac:
# it runs integration_test/app_store_screenshots_test.dart on the iPhone 16
# Pro Max simulator, once in English and once in French, and saves each
# screen with `simctl io screenshot`, plus 1206 x 2622 copies for the
# 6.1"/6.3" slot. It then records an app preview video in each language.
# Everything is uploaded as the "app-store-screenshots" artifact of the run,
# and also committed to the app-store-screenshots branch, so it can be opened
# on GitHub directly.
#
# The app talks to a demo backend inside the test (integration_test/
# demo_backend.dart) with a made-up account, so no server, account or
# secret is involved. Run it from the Actions tab with "Run workflow".

on:
  workflow_dispatch:
  pull_request:
    paths:
      - integration_test/**
      - .github/workflows/app-store-screenshots.yml

jobs:
  screenshots:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml lists the env files as assets, so they have to exist.
      # The test sets BASE_URL itself.
      - name: Create placeholder env files
        run: |
          echo "BASE_URL=http://127.0.0.1:8787/api" > .env.development
          echo "BASE_URL=http://127.0.0.1:8787/api" > .env.production

      # google_mobile_ads still ships only as a CocoaPod, and Flutter won't
      # mix CocoaPods with Swift Package Manager plugins, so build with
      # CocoaPods only.
      - run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Boot the iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for r in json.load(sys.stdin)["devices"].values() for d in r]
          for name in ("iPhone 16 Pro Max", "iPhone 15 Pro Max"):
              match = [d for d in devices if d["name"] == name]
              if match:
                  print(match[-1]["udid"])
                  break
          ')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 16 Pro Max or 15 Pro Max simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance light
          # The clean status bar Apple uses in its own screenshots.
          xcrun simctl status_bar "$udid" override --time 9:41 \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100
          echo "UDID=$udid" >> "$GITHUB_ENV"

      # The test serves the demo data on port 8787 and, at each screen,
      # puts the screenshot's name on /__pending until /__done says it's
      # saved.
      - name: Take screenshots
        run: |
          mkdir -p screenshots
          for lang in en fr; do
            flutter test integration_test/app_store_screenshots_test.dart \
              -d "$UDID" --dart-define=SCREENSHOT_LANG=$lang > "test-$lang.log" 2>&1 &
            pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              name=$(curl -s --max-time 2 http://127.0.0.1:8787/__pending || true)
              if [ -n "$name" ]; then
                mkdir -p "screenshots/$(dirname "$name")"
                xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
                curl -s -X POST http://127.0.0.1:8787/__done > /dev/null || true
                echo "Saved $name.png"
              fi
              sleep 1
            done
            status=0
            wait "$pid" || status=$?
            tail -n 30 "test-$lang.log"
            if [ "$status" -ne 0 ]; then
              echo "::error::The $lang screenshot run failed; see test-$lang.log in the artifact."
              exit "$status"
            fi
          done
          # The iPhone 6.1"/6.3" slot takes 1206 x 2622: scale to that height
          # and trim the extra pixel of width.
          for lang in en fr; do
            mkdir -p "screenshots/$lang-6.3in"
            for f in screenshots/$lang/*.png; do
              out="screenshots/$lang-6.3in/$(basename "$f")"
              sips --resampleHeight 2622 "$f" --out "$out" > /dev/null
              sips --cropToHeightWidth 2622 1206 "$out" > /dev/null
            done
          done
          for f in screenshots/*/*.png; do
            echo "$f: $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {print $2}' | paste -sd x -)"
          done

      # App previews: the same screens as a ~25 s walk-through. The test
      # says when to start and stop recording; the video is then made to
      # Apple's spec (886 x 1920, 30 fps, H.264, with a silent audio track,
      # 15 to 30 s).
      - name: Record app previews
        run: |
          command -v ffmpeg > /dev/null || brew install ffmpeg
          mkdir -p screenshots/previews
          for lang in en fr; do
            flutter test integration_test/app_store_screenshots_test.dart \
              -d "$UDID" --dart-define=SCREENSHOT_LANG=$lang \
              --dart-define=APP_PREVIEW=true > "preview-$lang.log" 2>&1 &
            pid=$!
            rec=
            while kill -0 "$pid" 2>/dev/null; do
              name=$(curl -s --max-time 2 http://127.0.0.1:8787/__pending || true)
              if [ "$name" = "preview/start" ]; then
                xcrun simctl io "$UDID" recordVideo --codec=h264 --force \
                  "raw-$lang.mov" 2> "record-$lang.log" &
                rec=$!
                # It takes several seconds to start capturing; carry on only
                # once it says so, or the first screens are missed.
                for _ in $(seq 1 150); do
                  grep -q "Recording started" "record-$lang.log" && break
                  sleep 0.2
                done
                cat "record-$lang.log"
                sleep 0.5
                curl -s -X POST http://127.0.0.1:8787/__done > /dev/null || true
              elif [ "$name" = "preview/end" ]; then
                kill -INT "$rec"
                wait "$rec" || true
                curl -s -X POST http://127.0.0.1:8787/__done > /dev/null || true
              fi
              sleep 0.2
            done
            status=0
            wait "$pid" || status=$?
            tail -n 30 "preview-$lang.log"
            if [ "$status" -ne 0 ]; then
              echo "::error::The $lang preview run failed; see preview-$lang.log in the artifact."
              exit "$status"
            fi
            ffmpeg -loglevel error -y -i "raw-$lang.mov" \
              -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
              -vf "fps=30,scale=886:-2,crop=886:1920:0:0,format=yuv420p" \
              -c:v libx264 -profile:v high -preset slow -crf 18 \
              -c:a aac -b:a 128k -t 29.5 -shortest -movflags +faststart \
              "screenshots/previews/app-preview-$lang.mp4"
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration \
              -of compact "screenshots/previews/app-preview-$lang.mp4"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: |
            screenshots/
            test-*.log
            preview-*.log
            record-*.log

      # Replaces the branch each run, so it only ever holds the latest set.
      - name: Commit screenshots to the app-store-screenshots branch
        run: |
          cd screenshots
          git init -q -b app-store-screenshots
          git add .
          git -c user.name="github-actions[bot]" \
            -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "App Store screenshots from ${GITHUB_SHA::7}"
          git push -f -q \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            app-store-screenshots
