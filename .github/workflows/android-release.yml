name: Android release

# Builds the Android App Bundle and uploads it to Google Play's internal
# testing track. It runs on its own when a version tag like v2.0.1 is pushed
# (ios-release.yml ships the same tag to TestFlight), or from the Actions tab
# with "Run workflow". From the internal track, promote the release to
# production in the Play Console. Pull requests that touch android/ build
# the bundle too, without uploading, so a broken build shows up before a tag.
#
# The versionCode is 300 plus the workflow run number (VERSION_CODE, read by
# android/app/build.gradle.kts), so every run gets a code Play hasn't seen, even
# a second run on the same commit. The offset keeps it above 250, the last code
# from the old commit-count scheme. A version tag must point at the tip of dev:
# a tag made on an out-of-date local dev would ship old code, so the run stops.
#
# Repository secrets it needs:
#   ANDROID_KEYSTORE_BASE64        The upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD      Its store password
#   ANDROID_KEY_ALIAS              The key alias inside it
#   ANDROID_KEY_PASSWORD           The key password
#   PLAY_SERVICE_ACCOUNT_JSON      Full contents of the Google Play service account JSON key
#   ENV_PRODUCTION                 Optional: other .env.production keys (SUPPORT_EMAIL,
#                                  PRIVACY_POLICY_URL), shared with iOS. Its BASE_URL is ignored.
#
# Optional repository variables:
#   PROD_BASE_URL                  The API root the app talks to. Defaults to
#                                  https://api.mouadfhm.duckdns.org/api
#   PLAY_RELEASE_STATUS            "completed" (default) rolls the release out to
#                                  internal testers; set it to "draft" while the
#                                  app has never been published, since Play only
#                                  accepts draft releases then.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - pubspec.yaml
      - .github/workflows/android-release.yml

concurrency:
  group: android-release-${{ github.event_name == 'pull_request' && github.ref || 'upload' }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag made on a local dev that wasn't pulled points at an old commit
      # (v2.0.10, v2.0.11 and v2.0.13 all pointed at f293b67 from 2026-10-20).
      - name: Check the tag is the latest dev
        if: github.ref_type == 'tag'
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/dev)" ] \
              && git merge-base --is-ancestor HEAD origin/dev; then
            behind=$(git rev-list --count HEAD..origin/dev)
            echo "::error::Tag $GITHUB_REF_NAME points at $(git rev-parse --short HEAD), $behind commits behind dev. Run 'git checkout dev && git pull' before tagging, or start this workflow from the Actions tab on dev."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write env files
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://api.mouadfhm.duckdns.org/api' }}
        run: .github/scripts/write-env.sh

      # build.gradle.kts signs release builds with android/key.properties.
      - name: Write upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The ANDROID_$name secret is missing."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Pick version code
        run: echo "VERSION_CODE=$((300 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - run: flutter build appbundle --release

      - name: Upload to Google Play (internal track)
        if: github.event_name != 'pull_request'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mouadfhm.fitness_tracker_front
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Remove signing files
        if: always()
        run: rm -f "$KEYSTORE_PATH" android/key.properties .env.production .env.development
