name: Android release

# Builds the Android App Bundle and uploads it to Google Play's internal
# testing track. It runs on its own when a version tag like v2.0.1 is pushed
# (ios-release.yml ships the same tag to TestFlight), or from the Actions tab
# with "Run workflow". From the internal track, promote the release to
# production in the Play Console.
#
# The versionCode is the git commit count (android/app/build.gradle.kts), so
# the checkout fetches the full history. Play refuses a versionCode it has
# already seen, so each upload needs at least one new commit.
#
# Repository secrets it needs:
#   ANDROID_KEYSTORE_BASE64        The upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD      Its store password
#   ANDROID_KEY_ALIAS              The key alias inside it
#   ANDROID_KEY_PASSWORD           The key password
#   PLAY_SERVICE_ACCOUNT_JSON      Full contents of the Google Play service account JSON key
#   ENV_PRODUCTION                 Full contents of .env.production (shared with iOS)
#
# Optional repository variable:
#   PLAY_RELEASE_STATUS            "completed" (default) rolls the release out to
#                                  internal testers; set it to "draft" while the
#                                  app has never been published, since Play only
#                                  accepts draft releases then.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write env files
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$ENV_PRODUCTION" ]; then
            echo "::error::The ENV_PRODUCTION secret is missing."
            exit 1
          fi
          printf '%s\n' "$ENV_PRODUCTION" > .env.production
          # main.dart loads .env.production; this one only has to exist.
          cp .env.production .env.development

      # build.gradle.kts signs release builds with android/key.properties.
      - name: Write upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The ANDROID_$name secret is missing."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter build appbundle --release

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mouadfhm.fitness_tracker_front
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Remove signing files
        if: always()
        run: rm -f "$KEYSTORE_PATH" android/key.properties .env.production .env.development
